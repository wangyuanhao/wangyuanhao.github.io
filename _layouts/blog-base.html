---
layout: compress
---
<!doctype html>
<html lang="{{ page.lang | default: 'zh-CN' }}" class="no-js">
  <head>
    {% include head.html %}
    <link rel="stylesheet" href="{{ '/assets/css/blog.css' | relative_url }}?v={{ site.time | date: '%s' }}">
    {% if page.math %}
      <script>
        window.MathJax = {
          tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], processEscapes: true },
          options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] }
        };
      </script>
      <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js"></script>
    {% endif %}
  </head>
  <body class="blog-page{% if page.body_class %} {{ page.body_class | escape }}{% endif %}" id="blog-top">
    <a class="blog-skip-link" href="#blog-main">跳转到正文</a>
    {% include masthead.html navigation="blog" %}
    <main class="blog-shell" id="blog-main">
      {{ content }}
    </main>
    <footer class="blog-footer">
      <span>© {{ site.time | date: '%Y' }} {{ site.name | escape }}</span>
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/blog/' | relative_url }}">Blog</a>
      <a href="{{ '/archives/' | relative_url }}">Archive</a>
      <a href="#blog-top">↑ 返回顶部</a>
    </footer>
    {% include scripts.html %}
    {% if page.blog %}<script defer src="{{ '/assets/js/blog.js' | relative_url }}"></script>{% endif %}
  </body>
</html>
